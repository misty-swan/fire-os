# 全ゲートCI（T078でT001の最小CIを拡張）。
# 1つでも失敗したらmerge・配置を行わない。Secret検査（check:environment）はbuild後（dist/にSecret名が現れないこと）。
# 各ゲートの意味は ops/deploy.md §1。Secretの値はこのファイルに書かない（参照する必要も無い）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# 権限は最小限（checkoutのみ）。check:migrationsの基準ref（origin/main）を取るために完全履歴でcheckoutする
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:contracts
      - run: npm run check:coverage
      - run: npm run check:migrations
      - run: npm run build
      - run: npm run check:environment
      - run: npx vitest --run
      - run: npx playwright install --with-deps chromium
      # 業務のe2eだけ（受入ゲート〔project acceptance〕は証跡indexの照合でフルe2eの結果に依存するためCIでは流さない＝T085裁定R10）
      - run: npm run test:e2e -- --project=setup --project=phone-360 --project=desktop-1280 --project=tablet-768
